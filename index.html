<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>آریانو دیزاین استودیو</title>

  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />

  <style>
    :root {
      --bg-black: #030303;
      --card-bg: rgba(20, 20, 20, 0.78);
      --btn-bg: rgba(45, 45, 45, 0.6);
      --btn-border: rgba(255, 255, 255, 0.15);
      --text-color: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: var(--bg-black);
      color: var(--text-color);
      font-family: "Vazirmatn", sans-serif;
      overflow: hidden;
    }

    /* =========================
       Dynamic Background
    ========================= */

    .dynamic-bg {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      background:
        radial-gradient(
          circle at 50% 50%,
          rgba(255,255,255,0.035),
          transparent 45%
        ),
        #030303;
    }

    /* نورهای شناور */

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.22;
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .orb-1 {
      width: 280px;
      height: 280px;
      background: rgba(255,255,255,0.18);
      top: -80px;
      left: -80px;
      animation: floatOrb1 18s ease-in-out infinite alternate;
    }

    .orb-2 {
      width: 220px;
      height: 220px;
      background: rgba(180,180,180,0.16);
      right: -60px;
      top: 25%;
      animation: floatOrb2 15s ease-in-out infinite alternate;
    }

    .orb-3 {
      width: 300px;
      height: 300px;
      background: rgba(255,255,255,0.10);
      bottom: -120px;
      left: 20%;
      animation: floatOrb3 20s ease-in-out infinite alternate;
    }

    @keyframes floatOrb1 {
      0% {
        transform: translate(0,0) scale(1);
      }

      50% {
        transform: translate(180px,120px) scale(1.2);
      }

      100% {
        transform: translate(60px,300px) scale(0.9);
      }
    }

    @keyframes floatOrb2 {
      0% {
        transform: translate(0,0) scale(1);
      }

      50% {
        transform: translate(-140px,100px) scale(1.25);
      }

      100% {
        transform: translate(-80px,-150px) scale(0.8);
      }
    }

    @keyframes floatOrb3 {
      0% {
        transform: translate(0,0);
      }

      50% {
        transform: translate(200px,-100px) scale(1.2);
      }

      100% {
        transform: translate(-100px,-180px) scale(0.85);
      }
    }


    /* خطوط نورانی متحرک */

    .light-line {
      position: absolute;
      width: 500px;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.22),
        transparent
      );

      opacity: 0.35;
      filter: blur(0.5px);
      transform: rotate(-35deg);
    }

    .line-1 {
      top: 15%;
      left: -200px;
      animation: moveLine1 12s linear infinite;
    }

    .line-2 {
      top: 65%;
      left: -300px;
      animation: moveLine2 16s linear infinite;
      opacity: 0.22;
    }

    .line-3 {
      top: 40%;
      right: -300px;
      animation: moveLine3 20s linear infinite;
      opacity: 0.18;
    }

    @keyframes moveLine1 {
      from {
        transform: translateX(0) rotate(-35deg);
      }

      to {
        transform: translateX(130vw) rotate(-35deg);
      }
    }

    @keyframes moveLine2 {
      from {
        transform: translateX(0) rotate(-35deg);
      }

      to {
        transform: translateX(140vw) rotate(-35deg);
      }
    }

    @keyframes moveLine3 {
      from {
        transform: translateX(0) rotate(35deg);
      }

      to {
        transform: translateX(-140vw) rotate(35deg);
      }
    }


    /* ذرات ریز شناور */

    .floating-particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: rgba(255,255,255,0.55);
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(255,255,255,0.5);
      animation: particleFloat linear infinite;
    }

    .particle:nth-child(1) {
      left: 10%;
      top: 80%;
      animation-duration: 14s;
    }

    .particle:nth-child(2) {
      left: 25%;
      top: 70%;
      animation-duration: 18s;
    }

    .particle:nth-child(3) {
      left: 40%;
      top: 90%;
      animation-duration: 12s;
    }

    .particle:nth-child(4) {
      left: 60%;
      top: 75%;
      animation-duration: 20s;
    }

    .particle:nth-child(5) {
      left: 75%;
      top: 85%;
      animation-duration: 16s;
    }

    .particle:nth-child(6) {
      left: 90%;
      top: 65%;
      animation-duration: 13s;
    }

    .particle:nth-child(7) {
      left: 15%;
      top: 50%;
      animation-duration: 19s;
    }

    .particle:nth-child(8) {
      left: 85%;
      top: 45%;
      animation-duration: 15s;
    }

    @keyframes particleFloat {

      0% {
        transform: translateY(80px) translateX(0);
        opacity: 0;
      }

      20% {
        opacity: 0.8;
      }

      50% {
        transform: translateY(-150px) translateX(40px);
      }

      80% {
        opacity: 0.5;
      }

      100% {
        transform: translateY(-350px) translateX(-30px);
        opacity: 0;
      }

    }


    /* =========================
       Particles.js
    ========================= */

    #particles-js {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: 1;
    }


    /* =========================
       Main Card
    ========================= */

    .wrap {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      z-index: 5;
    }

    .card {
      width: 100%;
      max-width: 320px;

      background: rgba(15,15,15,0.72);

      border-radius: 30px;

      padding: 75px 20px 30px;

      text-align: center;

      border: 1px solid rgba(255,255,255,0.12);

      box-shadow:
        0 25px 60px rgba(0,0,0,0.9),
        inset 0 0 40px rgba(255,255,255,0.015);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      opacity: 0;
      transform: translateY(20px);

      animation: fadeIn 0.8s forwards;

      position: relative;
    }


    /* نور خیلی ظریف دور کارت */

    .card::before {
      content: "";
      position: absolute;
      inset: -1px;

      border-radius: 30px;

      background:
        linear-gradient(
          120deg,
          transparent 20%,
          rgba(255,255,255,0.08),
          transparent 80%
        );

      opacity: 0.5;

      pointer-events: none;

      animation: cardGlow 7s linear infinite;
    }

    @keyframes cardGlow {

      0% {
        transform: translateX(-100%);
      }

      100% {
        transform: translateX(100%);
      }

    }


    /* =========================
       Avatar
    ========================= */

    .avatar {
      width: 120px;
      height: 120px;

      border-radius: 50%;

      margin: 0 auto -60px;

      transform: translateY(-60px);

      padding: 4px;

      background: #000;

      border: 2.5px solid #fff;

      position: relative;

      z-index: 2;

      box-shadow:
        0 10px 25px rgba(0,0,0,0.6),
        0 0 25px rgba(255,255,255,0.08);
    }

    .avatar img {
      width: 100%;
      height: 100%;

      border-radius: 50%;

      object-fit: cover;
    }


    h1 {
      margin: 15px 0 25px;

      font-size: 22px;

      font-weight: 800;

      letter-spacing: 1px;

      color: #fff;
    }


    /* =========================
       Buttons
    ========================= */

    .buttons {
      display: grid;
      gap: 12px;
    }

    .btn {
      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 14px 20px;

      color: #fff;

      background: rgba(45,45,45,0.58);

      text-decoration: none;

      font-weight: 600;

      border-radius: 18px;

      border: 1px solid rgba(255,255,255,0.15);

      transition:
        transform 0.3s ease,
        background 0.3s ease,
        border-color 0.3s ease,
        box-shadow 0.3s ease;

      font-size: 15px;

      position: relative;

      overflow: hidden;
    }


    /* نور عبوری روی دکمه */

    .btn::before {
      content: "";

      position: absolute;

      top: 0;
      left: -120%;

      width: 80%;
      height: 100%;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,0.08),
          transparent
        );

      transform: skewX(-20deg);

      transition: 0.6s;
    }

    .btn:hover::before {
      left: 140%;
    }

    .btn:hover {
      transform: translateY(-3px) scale(1.02);

      background: rgba(60,60,60,0.8);

      border-color: rgba(255,255,255,0.4);

      box-shadow:
        0 8px 25px rgba(0,0,0,0.45),
        0 0 20px rgba(255,255,255,0.04);
    }


    .icon-box {
      width: 28px;
      height: 28px;

      display: flex;

      align-items: center;

      justify-content: center;
    }

    .icon-box img {
      width: 100%;
      height: 100%;

      object-fit: contain;
    }


    /* =========================
       Footer
    ========================= */

    footer {
      margin-top: 25px;

      color: rgba(255,255,255,0.3);

      font-size: 10px;

      font-weight: 400;

      letter-spacing: 1.5px;
    }


    @keyframes fadeIn {

      to {
        opacity: 1;

        transform: translateY(0);
      }

    }


    /* موبایل */

    @media (max-width: 480px) {

      .card {
        max-width: 320px;
      }

      .orb {
        filter: blur(70px);
      }

    }

  </style>
</head>
